name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancels an outdated run when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automated_testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automated_testing/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Robot Framework dry run (syntax and keywords of every suite)
        run: python -m robot --dryrun --output NONE --report NONE --log NONE tests

      # The gate: every API test except the intentional defects must pass.
      - name: Run API tests (without known defects)
        run: python run.py --suite api --exclude known_bug

      - name: Upload API report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: robot-report-api
          path: automated_testing/results/
          retention-days: 14

      # The intentional defects must keep failing. If one of these tests passes,
      # a defect changed and the documentation is out of date.
      - name: Check that the 7 API known defects still fail
        run: |
          python run.py --suite api --include known_bug > known-bugs.log 2>&1 || true
          summary=$(grep -E "^[0-9]+ tests, " known-bugs.log | tail -1)
          echo "$summary"
          if [ "$summary" != "7 tests, 0 passed, 7 failed, 0 skipped." ]; then
            echo "::error::Expected exactly 7 failures and no passes in the known_bug API tests."
            exit 1
          fi

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: application/src_mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and publish the APK
        run: ./gradlew publishApk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: food-marketplace-apk
          path: application/public/food-marketplace.apk
          retention-days: 14

  mobile:
    name: Mobile tests (Android emulator)
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 34
    defaults:
      run:
        working-directory: automated_testing

    steps:
      - uses: actions/checkout@v4

      # The APK built by the previous job replaces the committed one, so the tests run on the current code.
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: food-marketplace-apk
          path: application/public

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automated_testing/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automated_testing/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies (Robot Framework, Appium and the UiAutomator2 driver)
        run: |
          pip install -r requirements.txt
          npm ci
          APPIUM_HOME=.appium npx appium driver install uiautomator2

      # Hardware acceleration: without KVM the emulator is too slow for UI tests.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the emulator snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot created."

      # run.py picks the first device of `adb devices` (the emulator). Its exit code is not used here:
      # the known defects make it fail, and the next step decides whether the result is the expected one.
      - name: Run mobile tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: automated_testing
          script: python run.py --suite mobile || true

      # The gate: every test without the known_bug tag passes, and the 8 known defects fail.
      - name: Check the mobile result
        run: |
          python - <<'EOF'
          import sys
          from robot.api import ExecutionResult

          tests = list(ExecutionResult("results/output.xml").suite.all_tests)
          unexpected = [t.name for t in tests if "known_bug" not in t.tags and t.status != "PASS"]
          known = [t for t in tests if "known_bug" in t.tags]
          fixed = [t.name for t in known if t.status != "FAIL"]
          print(f"{len(tests)} tests | {len(unexpected)} unexpected failures | "
                f"{len(known) - len(fixed)} of {len(known)} known defects failed")
          for name in unexpected:
              print(f"::error::Unexpected failure: {name}")
          for name in fixed:
              print(f"::error::Known defect test did not fail: {name}")
          if not tests or unexpected or fixed or len(known) != 8:
              sys.exit(1)
          EOF

      - name: Upload mobile report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: robot-report-mobile
          path: automated_testing/results/
          retention-days: 14
